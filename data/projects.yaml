# Every project once. `directions` tags it for the spoke pages: rank 1 = headline work for
# that direction, 2 = strong supporting evidence, 3 = worth a line. `blurb` replaces
# `summary` on that page so each audience reads the angle that matters to them.
# Clients are named by sector only, as in the German Qualifikationsprofil.

- id: torhaus
  title: Torhaus — a secure host for untrusted AI agents
  period: 2026 –
  start: 2026
  role: Founder, architect
  client: Open source
  tech: [Python, gVisor, Firecracker, Kubernetes, OPA, eBPF, MCP]
  summary: Framework that runs any AI agent harness in kernel-enforced compartments with default-deny egress, a credential broker and a tamper-evident audit log — designed on the assumption that the model itself may be hostile.
  highlights:
    - Threat model built from the 2026 trojaned-open-weights findings (Cohere/Qwen 3.8, "Model-as-a-Trojan")
    - Compartments (Zwinger) with data classification, typed one-way channels (Schleuse), a broker that never lets a credential reach the model
    - Egress gateway, MCP/tool proxy and model proxy as the single, policy-checked path out
  # TODO: add the repository link once the Torhaus repo is public.
  featured: true
  featured_rank: 2
  directions:
    security:
      rank: 1
      blurb: Secure runtime for AI agents built on the assumption that the model is the attacker. Compartments with data classification, default-deny egress through a single gateway, a broker so credentials never enter the model's environment, honeytokens, and a trojaned-model red-team suite that must fail to exfiltrate in CI.
    ai:
      rank: 2
      blurb: Infrastructure for running coding and research agents on self-hosted models without handing them the keys — the operational side of local AI.
    open-source:
      rank: 1
      blurb: Apache-licensed framework in early development; the umbrella for the agent-security work.

- id: ai-security-research
  title: "AI safety lecture and AI-security research"
  period: 2025 –
  start: 2025
  role: Speaker, researcher
  tech: [Open-weight LLMs, llama.cpp, vLLM, agent harnesses, egress analysis]
  summary: "One-hour public lecture, “AI: a giant leap — into heaven or hell?”, introducing AI safety for a general audience — how LLMs and agents work, why controlling them is harder than it looks, whether their reasoning can be watched, what AGI would mean. Alongside it, hands-on analysis of how open-weight models and agent harnesses leak data (training-proxy artifacts, backdoored weights, prompt-injection-to-RCE) and which deterministic controls stop them."
  links:
    - {url: "https://youtu.be/OMsONFIx_p8", text: "Lecture (Russian, 57 min)"}
    - {url: "https://youtu.be/e-0_39vcfgY", text: "Lecture (English, AI-dubbed, 42 min)"}
  directions:
    security:
      rank: 1
      blurb: "A one-hour public lecture introducing AI safety — reward hacking, the stop-button problem and corrigibility, reasoning tokens and neuralese, AGI — given live in Russian and dubbed into English. And the security counterpart in the lab: reproducing the 2026 findings on open-weight models phoning home, reading the research (Model-as-a-Trojan, Back-Reveal, pretraining-poisoning RCE) and deriving the controls that hold when the model cannot be trusted."
    ai:
      rank: 2
      blurb: "A general-audience lecture on what LLMs and agents are and why controlling them is hard — and, in the lab, the harness, proxy and egress settings that keep a self-hosted model from becoming an exfiltration channel."

